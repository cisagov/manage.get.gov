# This workflow syncs the pipfile.lock and requirements.txt
# dependabot will only update the pipfile.lock 
# This can result in pipfile.lock and requirements.txt being
# out of sync.

name: Sync requirements.txt
on:
  pull_request:
    paths: ["src/Pipfile", "src/Pipfile.lock"]
permissions:
  contents: write
jobs:
  sync:
    # if: github.actor == 'dependabot[bot]'
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pipenv
      - run: pipenv requirements > requirements.txt
        working-directory: src
      - name: Commit via API (GitHub-signed)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet src/requirements.txt; then
            echo "requirements.txt already in sync"; exit 0
          fi
          SHA=$(git rev-parse "HEAD:src/requirements.txt")
          gh api -X PUT "/repos/${GITHUB_REPOSITORY}/contents/src/requirements.txt" \
            -f message="Regenerate requirements.txt from Pipfile.lock" \
            -f branch="$BRANCH" \
            -f sha="$SHA" \
            -f content="$(base64 -w0 src/requirements.txt)"