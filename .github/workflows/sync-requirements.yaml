# This workflow syncs the pipfile.lock and requirements.txt
# dependabot will only update the pipfile.lock 
# This can result in pipfile.lock and requirements.txt being
# out of sync.

name: Sync requirements.txt
on:
  pull_request:
    paths: ["src/Pipfile", "src/Pipfile.lock"]
permissions:
  contents: write
jobs:
  sync:
    # if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pipenv
      # Git-sourced packages can't be hash-pinned, so they go in requirements-git.txt
      # (installed by src/bin/post_compile); everything else is hash-verified.
      - run: |
          { echo "--require-hashes"; pipenv requirements --hash | grep -v ' @ git+'; } > requirements.txt
          pipenv requirements | grep ' @ git+' > requirements-git.txt
        working-directory: src
      - name: Commit via API (GitHub-signed)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for f in requirements.txt requirements-git.txt; do
            if git diff --quiet "src/$f"; then
              echo "$f already in sync"; continue
            fi
            SHA=$(git rev-parse "HEAD:src/$f")
            gh api -X PUT "/repos/${GITHUB_REPOSITORY}/contents/src/$f" \
              -f message="Regenerate $f from Pipfile.lock" \
              -f branch="$BRANCH" \
              -f sha="$SHA" \
              -f content="$(base64 -w0 "src/$f")"
          done