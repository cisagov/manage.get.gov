# Manually deploy a branch of choice to an environment of choice.

name: Manual Build and Deploy
run-name: Manually build and deploy ${{ github.ref_name }} to ${{ github.event.inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'backup'
        type: 'choice'
        options:
          - aa
          - acadia
          - ad
          - backup
          - tjh
          - cp
          - amt
          - ab
          - cw
          - testdb
          - el
          - glacier
          - hotgov
          - kma
          - meoward
          - olympic
          - potato
          - product
          - rh
          - sm
          - yellowstone
          - zion

permissions:
  contents: read

jobs:
  variables:
    runs-on: ubuntu-latest
    steps:
      - name: Setting global variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: var
        with:
          script: |
            core.setOutput('environment', '${{ github.head_ref }}'.split("/")[0]);
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile USWDS assets
        working-directory: ./src
        run: |
          docker compose run node npm install npm@latest &&
          docker compose run node npm install &&
          docker compose run node npx gulp copyAssets &&
          docker compose run node npx gulp compile
      - name: Collect static assets 
        working-directory: ./src
        run: docker compose run app python manage.py collectstatic --no-input
      - name: Deploy to cloud.gov sandbox and setting env for '/version' endpoint
        uses: cloud-gov/cg-cli-tools@bafcd2b3d36984482c01b1dd2c3750b4f355b8a2 # v1.0.0
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          CF_USERNAME: CF_${{ github.event.inputs.environment }}_USERNAME
          CF_PASSWORD: CF_${{ github.event.inputs.environment }}_PASSWORD
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        with:
          cf_username: ${{ secrets[env.CF_USERNAME] }}
          cf_password: ${{ secrets[env.CF_PASSWORD] }}
          cf_org: cisa-dotgov
          cf_space: ${{ env.ENVIRONMENT }}
          cf_command: >-
            push -f ops/manifests/manifest-${{ env.ENVIRONMENT }}.yaml
            --var GIT_BRANCH="$GIT_BRANCH"
            --var GIT_COMMIT_SHA="$GIT_COMMIT_SHA"
            --strategy rolling
